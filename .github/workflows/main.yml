name: Build FLOW FILIPINO AI v6.4

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Prepare release artifact
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/FLOW-FILIPINO-AI-v6.4.apk

      - name: Show APK size
        run: ls -lh release/FLOW-FILIPINO-AI-v6.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLOW-FILIPINO-AI-v6.4
          path: release/FLOW-FILIPINO-AI-v6.4.apk
